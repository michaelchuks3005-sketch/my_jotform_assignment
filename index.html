<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pre-approval Form</title>
<link rel="stylesheet" href="assignment 1st week.css">
</head>
<body>

<div class="form-card">

  <div class="form-header">
    <h1>Let's Get Started On Your Pre-approval!</h1>
    <p>Apply in just under 5 minutes. It's obligation-free, and will not affect your credit score.</p>
  </div>

  <div class="section-title">About You</div>
  <div class="section-sub">Page 1 of 5</div>

  <form action="page2.html">
    <div class="field">
      <label class="required">Loan Purpose</label>
      <select required>
        <option value="">Please Select</option>
        <option value="">Emergency</option>
        <option value="">Education</option>
        <option value="">House rent</option>
      </select>
    </div>

    <div class="field">
      <label class="required">Desired Loan Amount</label>
      <input type="number" placeholder="e.g., 23" required>
      <div class="field-hint">Can be changed after approval</div>
    </div>

    <div class="field name-row">
      <div class="col">
        <label class="required">Full Name</label>
        <input type="text" required>
        <div class="field-hint">Given Name(s)</div>
      </div>
      <div class="col">
        <label>&nbsp;</label>
        <input type="text" required>
        <div class="field-hint">Last Name</div>
      </div>
    </div>

    <div class="field">
      <label class="required">Mobile Number</label>
      <input type="number" placeholder="0000-000-000" required>
      <div class="field-hint">Please enter a valid phone number.</div>
    </div>

    <div class="field">
      <label class="required">Date Of Birth</label>
      <div class="date-wrap">
        <input type="date" placeholder="DD/MM/YYYY" required>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2"></rect>
          <path d="M16 2v4M8 2v4M3 10h18"></path>
        </svg>
      </div>
      <div class="field-hint">Date</div>
    </div>

    <div class="field">
      <label class="required">Email Address</label>
      <input type="email" required>
    </div>

    <div class="field">
      <label>Drivers Licence Number</label>
      <input type="text" required>
    </div>

    <div class="field">
      <label class="required">Marital Status</label>
      <select required> 
        <option>Please Select</option>
        <option value="">Single</option>
        <option value="">Married</option>

      </select>
    </div>

    <button type="submit" class="next-btn">Next</button>
  </form>

</div>

</body>
</html>
